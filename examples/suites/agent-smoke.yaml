name: agent-smoke
version: 1
defaults:
  model: gpt-4o-mini
  feature_id: agent
  timeout_ms: 30000

cases:
  - id: tool_call_shape
    invoke:
      type: mock
      output: '{"tool_calls":[{"name":"search_docs","arguments":{"query":"budget limits"}}]}'
      latency_ms: 140
      cost_usd: 0.0002
    scorers:
      - type: json_schema
        schema:
          type: object
          required: [tool_calls]
          properties:
            tool_calls:
              type: array
      - type: contains
        value: search_docs

  - id: routes_to_calculator
    invoke:
      type: mock
      output: '{"tool_calls":[{"name":"calculator","arguments":{"expression":"2+2"}}]}'
      latency_ms: 110
      cost_usd: 0.00015
    scorers:
      - type: contains
        value: calculator
      - type: cost_max_usd
        max: 0.01

  - id: final_answer_similarity
    invoke:
      type: mock
      output: "Task complete. I used search_docs and returned the budget summary."
      latency_ms: 90
      cost_usd: 0.0001
    scorers:
      - type: similarity
        reference: "task complete budget summary"
        min_score: 0.35
        case_insensitive: true
