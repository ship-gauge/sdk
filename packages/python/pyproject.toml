[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipgauge"
version = "0.1.0"
description = "ShipGauge Python SDK — cost tracking for LLM apps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["shipgauge"]
