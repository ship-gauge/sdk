name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (patch | minor | major)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Trusted Publisher (OIDC): configure each package on npmjs.com
# Settings → Trusted Publisher → GitHub Actions → ship-gauge / sdk / publish-npm.yml
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shipgauge/scorers --filter @shipgauge/node --filter @shipgauge/cli build

      # pnpm "version" runs a package script — use npm version via exec instead
      - name: Bump versions
        run: |
          for pkg in @shipgauge/scorers @shipgauge/node @shipgauge/cli; do
            pnpm --filter "$pkg" exec npm version ${{ inputs.version }} --no-git-tag-version
          done
          echo "Versions after bump:"
          node -e "
            const fs=require('fs');
            for (const p of ['scorers','node','cli']) {
              const j=JSON.parse(fs.readFileSync('packages/'+p+'/package.json','utf8'));
              console.log(j.name, j.version);
            }
          "

      - name: Publish to npm
        run: |
          pnpm --filter @shipgauge/scorers publish --no-git-checks --access public
          pnpm --filter @shipgauge/node publish --no-git-checks --access public
          pnpm --filter @shipgauge/cli publish --no-git-checks --access public

      - name: Verify on registry
        run: |
          npm view @shipgauge/scorers version
          npm view @shipgauge/node version
          npm view @shipgauge/cli version
